# pnpm 11+ build policy.
# Dependency lifecycle scripts are blocked by default (strictDepBuilds is on),
# so each allowed package must be listed here explicitly.
allowBuilds:
  # Native SQLite addon — required at runtime.
  better-sqlite3: true
  # Vite's bundler (via @remix-run/dev) needs its platform binary setup.
  esbuild: true
  # Biome CLI binary setup (dev tooling).
  '@biomejs/biome': true
  # Native resolver used by eslint-import-resolver-typescript.
  unrs-resolver: true

# Security overrides — deliberately restricted to SAME-MAJOR patch bumps so they
# stay compatible with Remix 2 (which pins react-router 6.30.4 / turbo-stream 2.4.1).
# A fully clean audit would require the Remix -> React Router v7 migration.
overrides:
  react-router@<6.30.6: ^6.30.6
  react-router-dom@<6.30.6: ^6.30.6
  minimatch@>=9.0.0 <9.0.7: ^9.0.9
