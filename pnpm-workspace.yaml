# pnpm 11+ build policy.
# Dependency lifecycle scripts are blocked by default (strictDepBuilds is on),
# so each allowed package must be listed here explicitly.
allowBuilds:
  # Native SQLite addon — required at runtime.
  better-sqlite3: true
  # Vite's bundler needs its platform binary setup.
  esbuild: true
  # Biome CLI binary setup (dev tooling).
  '@biomejs/biome': true

# Security overrides (same-major, dev-only).
overrides:
  # Patched esbuild (transitively pulled by @esbuild-kit via drizzle-kit).
  esbuild@<=0.24.2: ^0.25.0
  # DoS fix in transitive build tooling.
  minimatch@>=9.0.0 <9.0.7: ^9.0.9
